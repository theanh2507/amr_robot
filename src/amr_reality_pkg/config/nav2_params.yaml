amcl:
  ros__parameters:
    use_sim_time: False                                         # gazebo: true
    alpha1: 0.1                                                 # nhieu do rotation gay ra cho rotation
    alpha2: 0.1                                                 # nhieu do translation gay ra cho rotation
    alpha3: 0.2                                                 # nhieu do translation gay ra cho translation
    alpha4: 0.1                                                 # nhieu do rotation gay ra cho translation
    alpha5: 0.0                                                 # danh cho robot kieu ommi
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1

    # Likelihood: do hop ly
    # lidar de len buc tuong tren ban do -> likehood cao -> hat do duoc giu lai
    # lidar dam xuyen qua tuong va lech ra khoang trong -> likehood thap -> hat do bi loai bo
    laser_likelihood_max_dist: 2.0                              # khoang cach toi da 2m, tia laser tu lidar nam cach xa hon 2m so voi tuong cua ban do thi coi do la nhieu
    laser_max_range: 12.0                                       # su dung gia tri laser toi da 10m
    laser_min_range: 0.2                                        # su dung gia tri laser toi thieu 0.2m
    laser_model_type: "likelihood_field"
    max_beams: 360                                              # so luong laser dung cho amcl
    max_particles: 5000                                         # so luong hat toi da
    min_particles: 500                                          # so luong hat toi thieu
    odom_frame_id: "odom"                                       # tra cuu tf giua odom_frame->base_frame
    pf_err: 0.1                                                 # sai so quan the hat toi da giua phan phoi thuc te va phan phoi uoc luong (de do do rong hep dam may particel filter)
    pf_z: 0.99                                                  # do tin cay
    recovery_alpha_fast: 0.1                                    # toc do suy giam cho bo loc ham mu uoc tinh ngan han
    recovery_alpha_slow: 0.002                                  # toc do suy giam cho bo loc ham mu uoc tinh dai han
    resample_interval: 1                                        # amcl cap nhat lai trong so cua tat ca cac hat sau do moi tien hanh kld (phan bo) lai cac hat
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5                                         # tan suat luu pose (0.5 <=> 2 giay luu 1 lan)
    sigma_hit: 0.2                                              # do lech chuan 20cmm duoc xem xet trong mo hinh xac suat
    tf_broadcast: true                                          # cho phep tf map -> odom
    transform_tolerance: 0.5                                    # cho phep 0.2 giay de xu ly tf
    update_min_a: 0.5                                           # goc xoay can thiet de cap nhat bo loc (rad)
    update_min_d: 0.2                                           # khoang cach tinh tien can di de cap nhat bo loc (m)
    z_hit: 0.95                                                 # tia laser do dung (cang cao cang tin tuong vao do chinh xac cua lidar va moi truong thuc te va ban do co do khop cao)
    z_max: 0.05                                                 # tia laser do khong phan hoi la hoac vuot qua gia tri max cua lidar
    z_rand: 0.05                                                # nhieu ngau nhien tao ra diem bat thuong
    z_short: 0.05                                               # tia laser do ngan hon thuc te (tia laser dap vao vat can bat ngo nhu con nguoi, xe qua lai)
    scan_topic: /scan_filtered

