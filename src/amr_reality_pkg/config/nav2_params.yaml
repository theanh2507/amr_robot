# dung o local costmap (tinh toan local path va dieu khien)
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0 
    costmap_update_timeout: 0.3
    use_realtime_priority: True
    publish_zero_velocity: True
    progress_checker_plugins: ["progress_checker"]              # kiem tra xem robot co bi ket ko
    goal_checker_plugins: ["goal_checker"]                      # kiem tra robot toi dich chua
    controller_plugins: ["FollowPath"]                          # thuat toan bam duong
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.1                                      # sai so giua robot va path
    speed_limit_topic: "/speed_limit"
    odom_topic: "/odometry/filtered"
    odom_duration: 0.3
    enable_stamped_cmd_vel: False
    bond_heartbeat_period: 0.5                                  # 2s gui hearbeat 1 lan cho lifecycle manager de bao lifecycle_manager van hoat dong binh thuong
    introspection_mode: "disabled"
    allow_parameter_qos_overrides: True

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"          # trong vong 20s ma robot ko di duoc 0.1m bao loi va behavior thuc hien recovery
      required_movement_radius: 0.1
      movement_time_allowance: 20.0                             
    # Goal checker parameters
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"              # den vi tri xy dung sai 0.2m va goc la 0.2 rad coi la toi dich
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.1
      stateful: True

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
     # Rotation Shim controller
      angular_dist_threshold: 0.5                               # nguong bat dau xoay tai cho, goc hien tai so voi path > 0.5 thi xoay tai cho  
      angular_disengage_threshold: 0.2                          # nguong nha xoay tra quyen dieu khien ve cho bo dieu khien chinh
      forward_sampling_distance: 0.5            
      rotate_to_goal_heading: true                              # true: khi den dich shirm se dam nhan viec xoay robot ve dung huong, false: do bo dk chinh dk huong
      max_angular_accel: 3.0                                    # Also used by RPP
      rotate_to_heading_angular_vel: 0.3 # also used by RPP     # gia toc goc yaw khi xoay tai cho
      simulate_ahead_time: 1.0                                  # thoi gian mo phong du doan va cham phia truoc
      closed_loop: true                                         # su dung odom de uoc tinh toc do hien tai

      # Regulated pure pursuit
      desired_linear_vel: 0.6                                   # van toc lon nhat cua robot
      lookahead_dist: 1.0                                       # only when use_velocity_scaled_lookahead_dist is False
      min_lookahead_dist: 0.5                                   # only when use_velocity_scaled_lookahead_dist is True
      max_lookahead_dist: 1.5                                   # only when use_velocity_scaled_lookahead_dist is True
      lookahead_time: 1.0                                       # dung de tinh khoang cach look ahead (L=v*t)
      transform_tolerance: 0.5                                  # qua 0.2 ko nhan duoc tf rpp bao loi
      use_velocity_scaled_lookahead_dist: true                  # cho phep thay doi khoang cach look ahead, chay nhanh nhin xa, chay cham nhin gan

      min_approach_linear_velocity: 0.05                        # van toc toi thieu khi robot ham phanh khi gan ve dich
      approach_velocity_scaling_dist: 1.0                       # cach dich 1m thi bat dau giam toc
      
      use_collision_detection: true                             # dung khi co nguy co va cham
      max_allowed_time_to_collision_up_to_carrot: 1.0           # thoi gian du bao va cham tren duong di tu robot den diem carrot
      use_regulated_linear_velocity_scaling: true               # slow down on high curvature paths (bat tat tinh nang giam toc khi gap duong cong co ban kinh nho)

      use_cost_regulated_linear_velocity_scaling: true          # needed for obstacle detection (giam toc tuyen tinh khi di gan vat can)
      cost_scaling_dist: 0.8                                    # cach vat can 0.8m thi bat dau giam toc
      cost_scaling_gain: 1.5                                    # he so giam toc (cang lon giam toc cang manh)

      regulated_linear_scaling_min_radius: 1.5                  # tu dong giam toc khi duong cong co ban kinh nho hon 1.5m
      regulated_linear_scaling_min_speed: 0.10                  # toc do toi thieu 0.1 m/s khi vao cua 
      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 1.2                             # kiem tra xem khoang cach 1.2m dang truoc co khuc cua gap khong de giam toc

      use_rotate_to_heading: false                              # cho phep xoay tai cho khi goc lech qua lon, false: vi dung rotation controller
      allow_reversing: false                                    # true: robot duoc phep di lui, false: robot chi duoc di thang
      rotate_to_heading_min_angle: 0.785                        # nguong goc lech de robot xoay tai cho
      use_cancel_deceleration: false
      max_robot_pose_search_dist: 2.0                           # default to local costmap width / 2
      interpolate_curvature_after_goal: false                   # false: ko cho phep tinh do cong de noi suy tim van toc
      stateful: true                                            # luu trang thai du lieu qua cac lan tinh toan de toi uu hieu nang
      allow_parameter_qos_overrides: true                       # cho phep cau hinh QoS
      min_distance_to_obstacle: -1.0                            # khoang cach toi thieu den vat can (-1: dung ban kinh footprint cua robot)



