controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    lock_memory: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: position_controllers/JointGroupPositionController

    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


position_controller:
  ros__parameters:
    command_interfaces:
      - position
    joints:
      - Left_Joint
      - Right_Joint

velocity_controller:
  ros__parameters:
    command_interfaces:
      - velocity
    joints:
      - Left_Joint
      - Right_Joint

trajectory_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - Left_Joint
      - Right_Joint

# Configuration for the differential drive controller
diff_drive_controller:
  ros__parameters:
    # Names of the left and right wheel joints
    left_wheel_names: ['Left_Joint']
    right_wheel_names: ['Right_Joint']

    # Robot physical parameters
    wheel_separation: 0.511 # Distance between the two wheels
    wheels_per_side: 1      # The number wheel on each side
    wheel_radius: 0.08      # Radius of the wheels

    # Multipliers for wheel separation and radius
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # Publisher settings
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # Controller settings
    open_loop: false              # false: use encoder to caculate odom
    enable_odom_tf: true          # auto publish odom -> base_footprint

    cmd_vel_timeout: 1.0          # seconds

    # false: cmd_vel co kieu du lieu la geometry_msgs/msg/Twist, true cmd_vel co kieu du lieu la geometry_msgs/msg/TwistStamped co gan moc thoi gian
    use_stamped_vel: false

    # Velocity and acceleration limits
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 0.7                  # m/s
    linear.x.min_velocity: -0.7
    linear.x.max_acceleration: 3.0
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 0.4                 # rad/s
    angular.z.min_velocity: -0.4
    angular.z.max_acceleration: 3.0
    angular.z.min_acceleration: -3.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0