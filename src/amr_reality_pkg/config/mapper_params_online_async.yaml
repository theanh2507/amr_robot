slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    # ceres_loss_function: None
    ceres_loss_function: "HuberLoss"

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_filtered
    use_map_saver: true                                                     # cho phep luu map 
    mode: mapping #localization
    # map_start_pose: [0.0, 0.0, 0.0]
    # map_start_at_dock: true

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    # map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    # map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 #if 0 never publishes odometry           # tan so publish map -> odom (50Hz)      
    map_update_interval: 3.0                                                # map duoc update moi 3s 1 lan
    resolution: 0.03                                                        # do phan giai, moi pixel tuong duong 3cm
    min_laser_range: 0.3  #for rastering images
    max_laser_range: 10.0 #for rastering images
    minimum_time_interval: 0.5                                              # khoang thoi gian quet giua cac lan o che do sync
    transform_timeout: 0.2                                                  # khoang thoi gian cho toi cho tf: 200ms
    tf_buffer_duration: 30.0                                                # tf_buffer du du lieu trong vong 30s
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true                                           # bat che do tuong tac voi rviz

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true

    # ── Scan matching thresholds ─────────────────────────────────────────────────────
    # Robot must move this much before a new node is added to the pose graph
    minimum_travel_distance: 0.4    # m                                      # 
    minimum_travel_heading: 0.3     # rad                                    #

    scan_buffer_size: 10                                                     # giu toi da 10 scan trong buffer
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.8
    link_scan_maximum_distance: 1.5

    # ── Loop closure ─────────────────────────────────────────────────────
    # Search radius for loop closure candidates
    loop_search_maximum_distance: 15.0                                        # slam tim kiem loop close trong pham vi 10m
    do_loop_closing: true 
    loop_match_minimum_chain_size: 5                                         # chi loop close khi xac nhan 10 lan quet lien tiep so khop thanh cong
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.25    
    loop_match_minimum_response_fine: 0.5

    # Correlation Parameters - Correlation Parameters (vung tim kiem cuc bo cua scan matching)
    correlation_search_space_dimension: 1.0                                  # khong gian tim kiem cua scan matching
    correlation_search_space_resolution: 0.01                                 
    correlation_search_space_smear_deviation: 0.1 

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 10.0                                         # kich thuoc o vuong 10*10 de slam tim kiem loop close
    loop_search_space_resolution: 0.05                                        # do phan giai luoi tim kiem
    loop_search_space_smear_deviation: 0.05

    # Scan Matcher Parameters
    distance_variance_penalty: 0.1                                            # giam de slam tin vao du lieu lidar hon odom, tranh bi troi
    angle_variance_penalty: 2.0    

    fine_search_angle_offset: 0.00349     
    coarse_search_angle_offset: 0.349             
    coarse_angle_resolution: 0.0349        
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
